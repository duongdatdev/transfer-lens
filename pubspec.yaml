name: transfer_lens
description: Offline OCR expense tracking from bank transfer confirmations.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  sqflite: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  image_cropper: ^12.2.1
  google_mlkit_text_recognition: ^0.17.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  image: ^4.10.1
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
